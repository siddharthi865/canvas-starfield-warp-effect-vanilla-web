<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Starfield Warp Effect</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-black text-white flex flex-col items-center justify-center min-h-screen"
  >
    <header class="text-center mb-4 px-4">
      <h1 class="text-2xl md:text-3xl font-bold">Starfield Warp Effect</h1>
      <p class="text-gray-400 text-sm md:text-base mt-1">
        Move your mouse or touch to control direction
      </p>
    </header>

    <main class="w-full max-w-5xl px-4">
      <canvas
        id="starfield"
        class="w-full h-[60vh] rounded-2xl shadow-lg border border-gray-800"
        aria-label="Starfield animation"
      ></canvas>
    </main>

    <footer class="mt-4 text-xs text-gray-500">
      Built with Canvas & requestAnimationFrame
    </footer>

    <script src="script.js"></script>
  </body>
</html>
